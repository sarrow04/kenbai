<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X投稿管理アプリ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #0f1419;
    color: #e7e9ea;
    padding: 16px;
    padding-bottom: 60px;
  }
  h1 {
    font-size: 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h1::before {
    content: "𝕏";
    font-size: 22px;
  }
  .card {
    background: #16181c;
    border: 1px solid #2f3336;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .form-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 10px;
  }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  label {
    font-size: 12px;
    color: #71767b;
  }
  input, textarea {
    background: #1e2126;
    border: 1px solid #2f3336;
    border-radius: 8px;
    color: #e7e9ea;
    padding: 8px 10px;
    font-size: 14px;
    width: 100%;
    font-family: inherit;
  }
  textarea {
    resize: vertical;
    min-height: 50px;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: #1d9bf0;
  }
  button {
    background: #1d9bf0;
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    margin-top: 6px;
  }
  button:active { opacity: 0.8; }
  .sort-bar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-bottom: 12px;
    padding-bottom: 4px;
  }
  .sort-btn {
    background: #1e2126;
    border: 1px solid #2f3336;
    color: #71767b;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    width: auto;
    margin-top: 0;
  }
  .sort-btn.active {
    background: #1d9bf0;
    color: #fff;
    border-color: #1d9bf0;
  }
  .post {
    background: #16181c;
    border: 1px solid #2f3336;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    position: relative;
  }
  .post-date {
    font-size: 12px;
    color: #71767b;
    margin-bottom: 6px;
  }
  .post-content {
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 10px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 13px;
  }
  .stat {
    display: flex;
    align-items: center;
    gap: 4px;
    color: #71767b;
  }
  .stat b {
    color: #e7e9ea;
    font-variant-numeric: tabular-nums;
  }
  .stat.imp b { color: #1d9bf0; }
  .memo {
    margin-top: 8px;
    font-size: 12px;
    color: #71767b;
    border-top: 1px dashed #2f3336;
    padding-top: 6px;
  }
  .del-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: transparent;
    border: none;
    color: #71767b;
    font-size: 16px;
    width: auto;
    padding: 2px 8px;
    margin: 0;
  }
  .empty {
    text-align: center;
    color: #71767b;
    font-size: 13px;
    padding: 30px 0;
  }
  .btn-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .btn-row .toggle-form {
    margin-bottom: 0;
  }
  .summary {
    display: flex;
    gap: 12px;
    font-size: 12px;
    color: #71767b;
    margin-bottom: 12px;
  }
  .summary b { color: #e7e9ea; }
</style>
</head>
<body>

<h1>投稿管理</h1>

<div class="summary" id="summary"></div>

<div class="btn-row">
<button class="toggle-form" id="toggleFormBtn">＋ 投稿を記録</button>
<button class="toggle-form" id="exportCsvBtn">⇩ CSV出力</button>
</div>

<div class="card" id="formCard" style="display:none;">
  <div class="form-grid">
    <div class="form-row">
      <label>投稿日</label>
      <input type="date" id="inputDate">
    </div>
    <div class="form-row">
      <label>投稿時刻</label>
      <input type="time" id="inputTime">
    </div>
  </div>
  <div class="form-row">
    <label>投稿内容（テキスト／URL）</label>
    <textarea id="inputContent" placeholder="投稿の内容やURLを入力"></textarea>
  </div>
  <div class="form-row">
    <label>計測タイミング（投稿からの経過時間）</label>
    <select id="inputMeasureTiming">
      <option value="24h">24時間後</option>
      <option value="48h">48時間後</option>
      <option value="72h">72時間後</option>
      <option value="other">その他</option>
    </select>
  </div>
  <div class="form-grid">
    <div class="form-row">
      <label>インプレッション</label>
      <input type="number" id="inputImp" inputmode="numeric" placeholder="0">
    </div>
    <div class="form-row">
      <label>いいね</label>
      <input type="number" id="inputLike" inputmode="numeric" placeholder="0">
    </div>
    <div class="form-row">
      <label>リプ数</label>
      <input type="number" id="inputReply" inputmode="numeric" placeholder="0">
    </div>
    <div class="form-row">
      <label>リポスト</label>
      <input type="number" id="inputRepost" inputmode="numeric" placeholder="0">
    </div>
    <div class="form-row">
      <label>ブックマーク</label>
      <input type="number" id="inputBookmark" inputmode="numeric" placeholder="0">
    </div>
  </div>
  <div class="form-row">
    <label>メモ（任意）</label>
    <textarea id="inputMemo" placeholder="気づいたことなど"></textarea>
  </div>
  <button id="saveBtn">保存する</button>
</div>

<div class="sort-bar">
  <button class="sort-btn active" data-sort="date">新しい順</button>
  <button class="sort-btn" data-sort="imp">インプ数順</button>
  <button class="sort-btn" data-sort="like">いいね順</button>
  <button class="sort-btn" data-sort="reply">リプ数順</button>
  <button class="sort-btn" data-sort="repost">リポスト順</button>
  <button class="sort-btn" data-sort="bookmark">ブックマーク順</button>
</div>

<div id="postList"></div>

<script>
  var STORAGE_KEY = 'xPostTrackerData';
  var posts = [];
  var currentSort = 'date';

  function loadPosts() {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      try {
        posts = JSON.parse(raw);
      } catch (e) {
        posts = [];
      }
    } else {
      posts = [];
    }
  }

  function savePosts() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
  }

  function todayStr() {
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    var parts = dateStr.split('-');
    if (parts.length !== 3) return dateStr;
    return parts[0] + '年' + parseInt(parts[1], 10) + '月' + parseInt(parts[2], 10) + '日';
  }

  function numOrZero(v) {
    var n = parseInt(v, 10);
    if (isNaN(n)) return 0;
    return n;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function renderSummary() {
    var el = document.getElementById('summary');
    if (posts.length === 0) {
      el.innerHTML = '';
      return;
    }
    var totalImp = 0, totalLike = 0, totalReply = 0;
    for (var i = 0; i < posts.length; i++) {
      totalImp += numOrZero(posts[i].imp);
      totalLike += numOrZero(posts[i].like);
      totalReply += numOrZero(posts[i].reply);
    }
    el.innerHTML =
      '投稿数 <b>' + posts.length + '</b>件　' +
      '累計インプ <b>' + totalImp.toLocaleString() + '</b>　' +
      '累計いいね <b>' + totalLike.toLocaleString() + '</b>　' +
      '累計リプ <b>' + totalReply.toLocaleString() + '</b>';
  }

  function getSortedPosts() {
    var arr = posts.slice();
    if (currentSort === 'date') {
      arr.sort(function(a, b) {
        if (a.date === b.date) return b.createdAt - a.createdAt;
        return b.date > a.date ? 1 : -1;
      });
    } else {
      var key = currentSort;
      arr.sort(function(a, b) {
        return numOrZero(b[key]) - numOrZero(a[key]);
      });
    }
    return arr;
  }

  function renderPosts() {
    var listEl = document.getElementById('postList');
    var sorted = getSortedPosts();

    if (sorted.length === 0) {
      listEl.innerHTML = '<div class="empty">まだ投稿が記録されていません</div>';
      return;
    }

    var html = '';
    for (var i = 0; i < sorted.length; i++) {
      var p = sorted[i];
      html += '<div class="post" data-id="' + p.id + '">';
      html += '<button class="del-btn" data-del="' + p.id + '">×</button>';
      var dateLine = formatDate(p.date);
      if (p.time) dateLine += ' ' + p.time;
      if (p.measureTiming) dateLine += '　計測: ' + (TIMING_LABELS[p.measureTiming] || p.measureTiming);
      html += '<div class="post-date">' + dateLine + '</div>';
      html += '<div class="post-content">' + escapeHtml(p.content) + '</div>';
      html += '<div class="stats">';
      html += '<div class="stat imp">👁 <b>' + numOrZero(p.imp).toLocaleString() + '</b></div>';
      html += '<div class="stat">♥ <b>' + numOrZero(p.like).toLocaleString() + '</b></div>';
      html += '<div class="stat">💬 <b>' + numOrZero(p.reply).toLocaleString() + '</b></div>';
      html += '<div class="stat">🔁 <b>' + numOrZero(p.repost).toLocaleString() + '</b></div>';
      html += '<div class="stat">🔖 <b>' + numOrZero(p.bookmark).toLocaleString() + '</b></div>';
      html += '</div>';
      if (p.memo) {
        html += '<div class="memo">' + escapeHtml(p.memo) + '</div>';
      }
      html += '</div>';
    }
    listEl.innerHTML = html;

    var delBtns = listEl.querySelectorAll('[data-del]');
    for (var j = 0; j < delBtns.length; j++) {
      delBtns[j].addEventListener('click', function(e) {
        var id = e.target.getAttribute('data-del');
        deletePost(id);
      });
    }
  }

  function deletePost(id) {
    if (!confirm('この投稿記録を削除しますか？')) return;
    posts = posts.filter(function(p) { return String(p.id) !== String(id); });
    savePosts();
    renderSummary();
    renderPosts();
  }

  function clearForm() {
    document.getElementById('inputDate').value = todayStr();
    document.getElementById('inputTime').value = '';
    document.getElementById('inputContent').value = '';
    document.getElementById('inputMeasureTiming').value = '24h';
    document.getElementById('inputImp').value = '';
    document.getElementById('inputLike').value = '';
    document.getElementById('inputReply').value = '';
    document.getElementById('inputRepost').value = '';
    document.getElementById('inputBookmark').value = '';
    document.getElementById('inputMemo').value = '';
  }

  var TIMING_LABELS = {
    '24h': '24時間後',
    '48h': '48時間後',
    '72h': '72時間後',
    'other': 'その他'
  };

  function saveNewPost() {
    var content = document.getElementById('inputContent').value.trim();
    if (!content) {
      alert('投稿内容を入力してください');
      return;
    }
    var newPost = {
      id: Date.now().toString(),
      createdAt: Date.now(),
      date: document.getElementById('inputDate').value || todayStr(),
      time: document.getElementById('inputTime').value || '',
      measureTiming: document.getElementById('inputMeasureTiming').value,
      content: content,
      imp: numOrZero(document.getElementById('inputImp').value),
      like: numOrZero(document.getElementById('inputLike').value),
      reply: numOrZero(document.getElementById('inputReply').value),
      repost: numOrZero(document.getElementById('inputRepost').value),
      bookmark: numOrZero(document.getElementById('inputBookmark').value),
      memo: document.getElementById('inputMemo').value.trim()
    };
    posts.push(newPost);
    savePosts();
    clearForm();
    document.getElementById('formCard').style.display = 'none';
    renderSummary();
    renderPosts();
  }

  function csvEscape(val) {
    var s = String(val === undefined || val === null ? '' : val);
    if (/[",\n]/.test(s)) {
      s = '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  }

  function exportCsv() {
    if (posts.length === 0) {
      alert('記録された投稿がありません');
      return;
    }
    var headers = ['投稿日', '投稿時刻', '計測タイミング', '投稿内容', 'インプレッション', 'いいね', 'リプ数', 'リポスト', 'ブックマーク', 'メモ'];
    var rows = [headers];
    var sorted = getSortedPosts();
    for (var i = 0; i < sorted.length; i++) {
      var p = sorted[i];
      rows.push([
        p.date || '',
        p.time || '',
        TIMING_LABELS[p.measureTiming] || p.measureTiming || '',
        p.content || '',
        numOrZero(p.imp),
        numOrZero(p.like),
        numOrZero(p.reply),
        numOrZero(p.repost),
        numOrZero(p.bookmark),
        p.memo || ''
      ]);
    }
    var csvLines = rows.map(function(row) {
      return row.map(csvEscape).join(',');
    });
    var csvContent = '\uFEFF' + csvLines.join('\r\n');
    var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var fname = 'x_posts_' + todayStr() + '.csv';
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function init() {
    loadPosts();
    document.getElementById('inputDate').value = todayStr();

    document.getElementById('toggleFormBtn').addEventListener('click', function() {
      var formCard = document.getElementById('formCard');
      var isHidden = formCard.style.display === 'none' || formCard.style.display === '';
      formCard.style.display = isHidden ? 'block' : 'none';
    });

    document.getElementById('saveBtn').addEventListener('click', saveNewPost);
    document.getElementById('exportCsvBtn').addEventListener('click', exportCsv);

    var sortBtns = document.querySelectorAll('.sort-btn');
    for (var i = 0; i < sortBtns.length; i++) {
      sortBtns[i].addEventListener('click', function(e) {
        var btn = e.target;
        currentSort = btn.getAttribute('data-sort');
        for (var k = 0; k < sortBtns.length; k++) {
          sortBtns[k].classList.remove('active');
        }
        btn.classList.add('active');
        renderPosts();
      });
    }

    renderSummary();
    renderPosts();
  }

  init();
</script>

</body>
</html>
